<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coletor 1doc</title>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; width: 320px; padding: 14px; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      .hint { font-size: 11px; color: #64748b; margin-bottom: 10px; }
      label { display: block; font-size: 11px; color: #555; margin: 8px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
      button { width: 100%; padding: 8px; margin-top: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; font-size: 13px; cursor: pointer; }
      button:disabled { background: #94a3b8; cursor: not-allowed; }
      .secondary { background: #e2e8f0; color: #0f172a; }
      #log { margin-top: 10px; font-size: 11px; padding: 8px; border-radius: 4px; background: #f1f5f9; min-height: 36px; white-space: pre-wrap; }
      .ok { background: #dcfce7 !important; color: #14532d; }
      .err { background: #fee2e2 !important; color: #7f1d1d; }
      details { margin-top: 8px; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Coletor de Protocolos</h1>
    <div class="hint">Abra a aba do 1doc com a lista, depois clique abaixo.</div>
    <button id="coletar">Coletar da aba atual</button>
    <div id="log">Pronto.</div>

    <div id="progress" style="display:none;margin-top:10px;font-size:11px;">
      <div id="prog-fase" style="font-weight:600;margin-bottom:4px;"></div>
      <div style="background:#e2e8f0;border-radius:4px;height:8px;overflow:hidden;margin-bottom:6px;">
        <div id="prog-bar" style="background:#2563eb;height:100%;width:0%;transition:width .2s;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;color:#475569;">
        <span id="prog-counts">0 / 0</span>
        <span id="prog-ok" style="color:#15803d;">✓ 0</span>
        <span id="prog-err" style="color:#b91c1c;">✕ 0</span>
      </div>
      <div id="prog-atual" style="margin-top:4px;color:#64748b;"></div>
      <details id="prog-erros-wrap" style="margin-top:6px;display:none;">
        <summary style="cursor:pointer;color:#b91c1c;">Erros recentes</summary>
        <ul id="prog-erros" style="margin:4px 0 0 16px;padding:0;color:#7f1d1d;"></ul>
      </details>
    </div>

    <label style="display:flex;align-items:center;gap:6px;margin-top:12px;">
      <input id="autoCloseTab" type="checkbox" checked style="width:auto;" />
      Fechar abas de detalhe após coletar
    </label>
    <label style="display:flex;align-items:center;gap:6px;margin-top:6px;">
      <input id="coletarDetalhes" type="checkbox" checked style="width:auto;" />
      Abrir cada protocolo para coletar detalhes
    </label>
    <label style="display:flex;align-items:center;gap:6px;margin-top:6px;">
      <input id="apenasArquivado" type="checkbox" checked style="width:auto;" />
      Apenas com marcador "Arquivado✅"
    </label>
    <label>Delay entre protocolos (ms)</label>
    <input id="delayDetalheMs" type="number" min="100" value="500" />
    <label>Máx. de protocolos por execução</label>
    <input id="maxDetalhes" type="number" min="1" value="200" />
    <button id="salvar-opts" class="secondary">Salvar opções</button>

    <details>
      <summary>Configurações de backend</summary>
      <label>URL do backend</label>
      <input id="backend" placeholder="https://seu-app.lovable.app" />
      <label>Token</label>
      <input id="token" type="password" placeholder="Cole o token" />
      <button id="salvar" class="secondary">Salvar</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
